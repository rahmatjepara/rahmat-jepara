<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      .line{fill:none;stroke:#b79e78;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
      .thin{fill:none;stroke:#b79e78;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
      .fill{fill:#b79e78;opacity:.22}
    </style>
    <g id="leafPair">
      <path class="thin" d="M0 0 C-34 -8 -60 -34 -66 -66 C-28 -62 -4 -38 0 0"/>
      <path class="thin" d="M0 0 C34 -8 60 -34 66 -66 C28 -62 4 -38 0 0"/>
    </g>
    <g id="bud">
      <path class="thin" d="M0 22 C-18 8 -24 -16 -10 -34 C0 -48 0 -48 10 -34 C24 -16 18 8 0 22 Z"/>
      <path class="thin" d="M0 -34 C0 -56 14 -72 32 -78 C28 -54 18 -40 0 -34"/>
      <path class="thin" d="M0 -34 C0 -56 -14 -72 -32 -78 C-28 -54 -18 -40 0 -34"/>
    </g>
    <g id="rosette">
      <circle class="thin" cx="0" cy="0" r="22"/>
      <path class="thin" d="M0 -62 C18 -52 22 -22 0 -8 C-22 -22 -18 -52 0 -62Z"/>
      <path class="thin" d="M62 0 C52 18 22 22 8 0 C22 -22 52 -18 62 0Z"/>
      <path class="thin" d="M0 62 C-18 52 -22 22 0 8 C22 22 18 52 0 62Z"/>
      <path class="thin" d="M-62 0 C-52 -18 -22 -22 -8 0 C-22 22 -52 18 -62 0Z"/>
      <path class="thin" d="M44 -44 C46 -22 24 -10 8 -8 C10 -24 22 -46 44 -44Z"/>
      <path class="thin" d="M44 44 C22 46 10 24 8 8 C24 10 46 22 44 44Z"/>
      <path class="thin" d="M-44 44 C-46 22 -24 10 -8 8 C-10 24 -22 46 -44 44Z"/>
      <path class="thin" d="M-44 -44 C-22 -46 -10 -24 -8 -8 C-24 -10 -46 -22 -44 -44Z"/>
      <circle class="fill" cx="0" cy="0" r="10"/>
    </g>
    <g id="spiralFlower">
      <path class="line" d="M0 0 C12 -34 44 -48 68 -38 C96 -26 102 16 76 34 C52 50 16 42 -4 14 C-26 -16 -24 -58 8 -80 C42 -104 88 -96 120 -68"/>
      <use href="#leafPair" transform="translate(62 -34) rotate(12) scale(.85)"/>
      <use href="#bud" transform="translate(102 -72) scale(.5) rotate(18)"/>
    </g>
    <g id="cornerFlourish">
      <path class="line" d="M110 820 C82 756 92 690 142 646 C194 598 286 598 340 652 C392 704 396 792 342 846 C292 896 212 900 160 866"/>
      <path class="line" d="M158 868 C114 878 68 868 36 834 C8 804 -2 760 8 720"/>
      <path class="line" d="M114 812 C136 754 172 712 222 684 C266 660 324 656 374 676"/>
      <use href="#leafPair" transform="translate(228 682) rotate(114) scale(1.1)"/>
      <use href="#leafPair" transform="translate(158 738) rotate(162) scale(.95)"/>
      <use href="#leafPair" transform="translate(154 846) rotate(74) scale(.9)"/>
      <use href="#bud" transform="translate(336 654) scale(.8) rotate(52)"/>
      <use href="#bud" transform="translate(70 836) scale(.68) rotate(-54)"/>
      <use href="#spiralFlower" transform="translate(250 744) scale(.68) rotate(-16)"/>
      <path class="thin" d="M118 906 C162 876 206 874 254 896"/>
      <use href="#leafPair" transform="translate(230 894) rotate(-90) scale(.7)"/>
    </g>
    <g id="sideBranchH">
      <path class="line" d="M0 0 C80 -16 160 -18 236 0 C302 16 364 42 430 52"/>
      <path class="line" d="M430 52 C364 62 302 88 236 104 C160 122 80 120 0 104"/>
      <use href="#leafPair" transform="translate(120 6) rotate(18) scale(.8)"/>
      <use href="#leafPair" transform="translate(252 56) rotate(-10) scale(.9)"/>
      <use href="#leafPair" transform="translate(116 98) rotate(162) scale(.8)"/>
      <use href="#bud" transform="translate(24 54) scale(.55) rotate(-90)"/>
      <use href="#bud" transform="translate(408 54) scale(.55) rotate(90)"/>
      <use href="#rosette" transform="translate(214 52) scale(.34)"/>
    </g>
    <g id="sideBranchV">
      <path class="line" d="M0 0 C-16 80 -18 160 0 236 C16 302 42 364 52 430"/>
      <path class="line" d="M52 430 C62 364 88 302 104 236 C122 160 120 80 104 0"/>
      <use href="#leafPair" transform="translate(6 120) rotate(108) scale(.8)"/>
      <use href="#leafPair" transform="translate(56 252) rotate(80) scale(.9)"/>
      <use href="#leafPair" transform="translate(98 116) rotate(-72) scale(.8)"/>
      <use href="#bud" transform="translate(54 24) scale(.55) rotate(180)"/>
      <use href="#bud" transform="translate(54 408) scale(.55) rotate(0)"/>
      <use href="#rosette" transform="translate(52 214) scale(.34)"/>
    </g>
  </defs>

  <!-- Corner ornaments -->
  <use href="#cornerFlourish"/>
  <use href="#cornerFlourish" transform="translate(1000 0) scale(-1 1)"/>
  <use href="#cornerFlourish" transform="translate(0 1000) scale(1 -1)"/>
  <use href="#cornerFlourish" transform="translate(1000 1000) scale(-1 -1)"/>

  <!-- Side ornaments -->
  <use href="#sideBranchH" transform="translate(285 82) scale(1.02)"/>
  <use href="#sideBranchH" transform="translate(285 814) scale(1.02)"/>
  <use href="#sideBranchV" transform="translate(82 285) scale(1.02)"/>
  <use href="#sideBranchV" transform="translate(814 285) scale(1.02)"/>

  <!-- Center composition -->
  <g transform="translate(500 510)">
    <use href="#rosette" transform="scale(1.12)"/>
    <path class="line" d="M0 -18 C0 -146 92 -240 226 -252"/>
    <path class="line" d="M0 -18 C0 -146 -92 -240 -226 -252"/>
    <path class="line" d="M0 18 C0 146 92 240 226 252"/>
    <path class="line" d="M0 18 C0 146 -92 240 -226 252"/>

    <use href="#leafPair" transform="translate(0 -132) rotate(0) scale(1.15)"/>
    <use href="#leafPair" transform="translate(132 0) rotate(90) scale(1.15)"/>
    <use href="#leafPair" transform="translate(0 132) rotate(180) scale(1.15)"/>
    <use href="#leafPair" transform="translate(-132 0) rotate(-90) scale(1.15)"/>

    <use href="#spiralFlower" transform="translate(170 -170) scale(.92) rotate(10)"/>
    <use href="#spiralFlower" transform="translate(-170 -170) scale(-.92 .92) rotate(10)"/>
    <use href="#spiralFlower" transform="translate(170 170) scale(.92 -.92) rotate(10)"/>
    <use href="#spiralFlower" transform="translate(-170 170) scale(-.92 -.92) rotate(10)"/>

    <use href="#bud" transform="translate(0 -228) scale(.95)"/>
    <use href="#bud" transform="translate(228 0) scale(.95) rotate(90)"/>
    <use href="#bud" transform="translate(0 228) scale(.95) rotate(180)"/>
    <use href="#bud" transform="translate(-228 0) scale(.95) rotate(-90)"/>
  </g>
</svg>